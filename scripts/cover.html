<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1200px; height: 630px;
    background: radial-gradient(circle at 20% 15%, #10241c 0%, #060a10 55%, #030407 100%);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glow {
    position:absolute; width:600px; height:600px; border-radius:50%;
    background: radial-gradient(circle, rgba(16,185,129,0.25), transparent 70%);
    top:-180px; left:-140px;
  }
  .content {
    position:relative; z-index:2;
    padding: 72px 80px;
    height:100%;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .badge {
    display:inline-flex; align-items:center; gap:10px;
    color:#6ee7b7; font-size:20px; font-weight:600; letter-spacing:0.5px;
    border:1px solid rgba(110,231,183,0.35); border-radius:999px;
    padding:8px 18px; width:fit-content;
    background: rgba(16,185,129,0.08);
  }
  .dot { width:10px; height:10px; border-radius:50%; background:#34d399; box-shadow:0 0 12px #34d399; }
  h1 {
    font-size:96px; color:#f8fafc; font-weight:800; letter-spacing:-2px;
    margin-top:28px;
  }
  h1 span { color:#34d399; }
  .tagline {
    font-size:32px; color:#94a3b8; margin-top:18px; max-width:820px; line-height:1.35;
  }
  .row { display:flex; align-items:center; justify-content:space-between; }
  .status-cards { display:flex; gap:18px; }
  .card {
    width:150px; border-radius:16px; padding:18px 20px;
    border:2px solid; font-weight:700; font-size:18px;
  }
  .card small { display:block; font-weight:500; font-size:15px; opacity:0.8; margin-top:6px; }
  .safe { border-color:#10b981; background:rgba(16,185,129,0.10); color:#6ee7b7; }
  .amber { border-color:#f59e0b; background:rgba(245,158,11,0.10); color:#fcd34d; }
  .red { border-color:#ef4444; background:rgba(239,68,68,0.10); color:#fca5a5; }
  .footer {
    display:flex; align-items:center; justify-content:space-between;
    font-size:22px; color:#64748b;
  }
  .footer b { color:#cbd5e1; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <div>
      <div class="badge"><span class="dot"></span> AssemblyAI Voice Agent Hackathon</div>
      <h1>Temp<span>Check</span></h1>
      <div class="tagline">Hands-free HACCP temperature logging for kitchens — every flagged number read back and confirmed, out loud, before it's saved.</div>
    </div>
    <div>
      <div class="row" style="margin-bottom:36px;">
        <div class="status-cards">
          <div class="card safe">38°F<small>Walk-in cooler</small></div>
          <div class="card amber">130°F<small>Steam table</small></div>
          <div class="card red">149°F<small>Ground beef</small></div>
        </div>
      </div>
      <div class="footer">
        <div>Built with <b>AssemblyAI Voice Agent API</b></div>
        <div>github.com/pranuthi777/tempcheck-vs</div>
      </div>
    </div>
  </div>
</body>
</html>
